name: Live SEO audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/scripts/audit_live_site.mjs'
      - '.github/workflows/live-seo-audit.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live sitemap URLs, HTTP status and canonical tags
        run: node site/scripts/audit_live_site.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-site-audit
          path: live-site-audit.json
          retention-days: 30
