name: SEO integrity

on:
  pull_request:
    paths:
      - "site/**"
      - "tests/**"
      - ".github/workflows/seo-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "tests/**"
      - ".github/workflows/seo-integrity.yml"

permissions:
  contents: read

concurrency:
  group: seo-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Canonical, sitemap and crawl gates
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify catalog routing and quote conversions
        run: node --test tests/*.test.mjs

      - name: Verify owner-confirmed business address
        run: python site/scripts/sync_business_address.py --check

      - name: Verify sitemap uses the canonical page source
        shell: pwsh
        run: ./site/scripts/generate_sitemap.ps1

      - name: Reject redirect chains, loops and legacy internal links
        shell: pwsh
        run: ./site/scripts/audit_redirects.ps1

      - name: Run complete public-site integrity audit
        shell: pwsh
        run: ./site/scripts/audit_site_integrity.ps1

      - name: Reject exact duplicate content and report intent overlap
        shell: pwsh
        run: ./site/scripts/audit_content_overlap.ps1
